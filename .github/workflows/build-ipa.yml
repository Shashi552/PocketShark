name: Build PocketShark IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Compile SharkMobile for iOS arm64
        run: |
          mkdir -p build/Payload/SharkMobile.app
          
          # Compile pure-Swift source into Mach-O 64-bit arm64 iOS binary
          swiftc -O \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework NetworkExtension \
            -framework CoreBluetooth \
            -framework Network \
            -framework Security \
            -framework LocalAuthentication \
            -framework CoreLocation \
            -o build/Payload/SharkMobile.app/SharkMobile \
            Sources/SharkMobileCore/*.swift

          # Copy Brand Icon Assets
          cp Assets/AppIcon.png build/Payload/SharkMobile.app/AppIcon60x60@2x.png
          cp Assets/AppIcon.png build/Payload/SharkMobile.app/AppIcon60x60@3x.png
          cp Assets/AppIcon.png build/Payload/SharkMobile.app/AppIcon76x76@2x~ipad.png
          cp Assets/AppIcon.png build/Payload/SharkMobile.app/iTunesArtwork@2x

          # Generate Info.plist
          cat << 'EOF' > build/Payload/SharkMobile.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SharkMobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.shashank.pocketshark</string>
              <key>CFBundleName</key>
              <string>PocketShark</string>
              <key>CFBundleDisplayName</key>
              <string>PocketShark</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>SharkMobile requires Bluetooth access to monitor live over-the-air BLE airspace packets and detect proximity beacons.</string>
              <key>NSBluetoothPeripheralUsageDescription</key>
              <string>SharkMobile requires Bluetooth access to analyze airspace beacons and peripheral frames.</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>SharkMobile requires location access to georeference network packet captures and plot tactical wardriving telemetry.</string>
              <key>NSFaceIDUsageDescription</key>
              <string>SharkMobile requires Face ID / Touch ID to authenticate secure access to the PCAP vault and classified case files.</string>
              <key>NSLocalNetworkUsageDescription</key>
              <string>SharkMobile requires local network access to discover active interfaces, capture multicast mDNS/SSDP datagrams, and inspect LAN devices.</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          cd build
          zip -qr ../PocketShark.ipa Payload
          cp ../PocketShark.ipa ../SharkMobile.ipa
          cd ..
          ls -lh PocketShark.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketShark-IPA
          path: PocketShark.ipa
          retention-days: 14
