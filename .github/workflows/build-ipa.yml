name: Build SharkMobile IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Compile SharkMobile for iOS arm64
        run: |
          mkdir -p build/Payload/SharkMobile.app
          
          # Compile pure-Swift source into Mach-O 64-bit arm64 iOS binary
          swiftc -O \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -o build/Payload/SharkMobile.app/SharkMobile \
            Sources/SharkMobileCore/*.swift

          # Generate Info.plist
          cat << 'EOF' > build/Payload/SharkMobile.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SharkMobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.shashank.sharkmobile</string>
              <key>CFBundleName</key>
              <string>SharkMobile</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Package IPA
        run: |
          cd build
          zip -qr ../SharkMobile.ipa Payload
          cd ..
          ls -lh SharkMobile.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkMobile-IPA
          path: SharkMobile.ipa
          retention-days: 14
